---
layout: default
---

<article class="entry-shell h-entry">
  <header class="entry-header">
    <p class="entry-type">Post</p>
    <h1 class="entry-title p-name">{{ page.title | escape }}</h1>
    <p class="entry-meta"><time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time></p>
    {% if page.description %}<p class="entry-description">{{ page.description }}</p>{% endif %}
  </header>
  <div class="entry-content e-content">{{ content }}</div>
</article>
